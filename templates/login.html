{% load static %}<!DOCTYPE html>
<html lang="id" data-theme="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Masuk · VELLOSCRIPT</title>
<link rel="stylesheet" href="{% static 'fonts/google-fonts.css' %}">
<link rel="stylesheet" href="{% static 'css/app.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0"
      crossorigin="anonymous">
<script>
(function () {
  try {
    var t = localStorage.getItem('vs-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark"><i class="fa-solid fa-feather-pointed"></i></span>
      <div>
        <div class="name">VELLOSCRIPT</div>
        <div class="tag">Draft PT Perorangan</div>
      </div>
      <button type="button" class="icon-btn" id="theme-toggle" style="margin-left:auto;"
              title="Ganti tema terang / gelap" aria-label="Ganti tema">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>

    <h1>Masuk</h1>
    <p class="sub">Gunakan akun yang terdaftar untuk melanjutkan.</p>

    {% if error %}
    <div class="alert" role="alert">
      <i class="fa-solid fa-circle-exclamation" style="margin-top:2px;"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form action="{% url 'login' %}" method="post" autocomplete="on">
      {% csrf_token %}

      <div class="field" style="margin-bottom:14px;">
        <label class="label" for="username">Nama pengguna</label>
        <div class="input-icon">
          <i class="fa-solid fa-user"></i>
          <input type="text" name="username" id="username" value="{{ username }}"
                 placeholder="nama pengguna" required autofocus autocomplete="username">
        </div>
      </div>

      <div class="field" style="margin-bottom:20px;">
        <label class="label" for="password">Kata sandi</label>
        <div class="input-icon">
          <i class="fa-solid fa-lock"></i>
          <input type="password" name="password" id="password"
                 placeholder="kata sandi" required autocomplete="current-password">
          <button type="button" class="toggle" id="toggle-password"
                  title="Tampilkan kata sandi" aria-label="Tampilkan kata sandi">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Masuk
      </button>
    </form>

    <div class="auth-foot">Akun dibuat oleh administrator.</div>
  </div>
</div>

<script>
(function () {
  var root = document.documentElement;

  function currentTheme() {
    var set = root.getAttribute('data-theme');
    if (set === 'dark' || set === 'light') return set;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function syncIcon() {
    var i = document.querySelector('#theme-toggle i');
    if (i) i.className = currentTheme() === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
  }
  syncIcon();
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('vs-theme', next); } catch (e) {}
    syncIcon();
  });

  var pwd = document.getElementById('password');
  var tgl = document.getElementById('toggle-password');
  tgl.addEventListener('click', function () {
    var show = pwd.type === 'password';
    pwd.type = show ? 'text' : 'password';
    tgl.querySelector('i').className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
    tgl.title = show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi';
  });
})();
</script>
</body>
</html>
